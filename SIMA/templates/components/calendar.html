<div class="calendar-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold mb-0">{{ mes_nombre }} {{ anio }}</h6>
    </div>
    
    <table class="table table-sm table-borderless text-center mb-0" style="font-size: 0.85rem;">
        <thead>
            <tr class="text-muted">
                <th>Do</th>
                <th>Lu</th>
                <th>Ma</th>
                <th>Mi</th>
                <th>Ju</th>
                <th>Vi</th>
                <th>Sa</th>
            </tr>
        </thead>
        <tbody>
            {% for semana in calendario_semanas %}
                <tr>
                    {% for dia in semana %}
                        <td>
                            {% if dia %}
                                <div class="{% if dia.clases_count > 0 %}calendar-day-class{% endif %} {% if dia.es_hoy %}border border-primary{% endif %} {% if dia.feriado %}bg-danger bg-opacity-10 text-danger{% endif %}" 
                                     title="{% if dia.feriado %}{{ dia.feriado }}{% elif dia.clases_count > 0 %}{{ dia.clases_count }} clases{% endif %}"
                                     style="position: relative; cursor: default;">
                                    {{ dia.numero }}
                                    {% if dia.feriado %}
                                        <div style="font-size: 7px; position: absolute; bottom: 0; left: 0; width: 100%; text-align: center; font-weight: bold;">FER</div>
                                    {% elif dia.clases_count > 0 %}
                                        <span class="class-count-badge">{{ dia.clases_count }}</span>
                                    {% endif %}
                                </div>
                            {% else %}
                                <span class="text-white-50">.</span>
                            {% endif %}
                        </td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
