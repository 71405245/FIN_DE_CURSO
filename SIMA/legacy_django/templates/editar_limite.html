{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white p-4 rounded-top-4">
                    <h4 class="fw-bold mb-0">🛠️ Ajustar Límite de Créditos</h4>
                    <p class="mb-0 opacity-75">Estudiante: {{ estudiante.username }}</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="limite_creditos" class="form-label fw-bold">Nuevo Límite de Créditos</label>
                            <input type="number" name="limite_creditos" id="limite_creditos"
                                class="form-control form-control-lg rounded-3" value="{{ estudiante.limite_creditos }}"
                                min="1" max="28" required>
                            <div class="form-text mt-2">
                                <i class="fas fa-info-circle me-1"></i> El límite estándar es 24. El máximo permitido
                                por reglamento es 28.
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                                Guardar Cambios
                            </button>
                            <a href="{% url 'panel_admin' %}" class="btn btn-outline-secondary rounded-pill">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
