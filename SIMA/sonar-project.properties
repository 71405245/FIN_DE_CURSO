# =============================================
# SIMA - Configuración de SonarQube Local
# =============================================

sonar.projectKey=sima-mern
sonar.projectName=SIMA - Sistema Integral de Matricula Academica
sonar.projectVersion=1.0

# Ruta del código fuente a analizar
sonar.sources=backend/controllers,backend/routes,backend/models,backend/middleware,frontend/src

# Excluir archivos no relevantes
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/backup_db.js,**/comparativa_consumo.js,**/importar.js

# Archivos de cobertura generados por Jest
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# URL del servidor SonarQube local
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8


